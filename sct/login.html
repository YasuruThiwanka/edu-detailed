<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SCT</title>
    <link rel="icon" href="assets/img/logo-sct.svg" type="image/svg+xml">

    <!-- External Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="bg-light">

    <!-- Main Content -->
    <main class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg" style="width: 24rem;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="assets/img/logo-sct.svg" alt="SCT Logo" width="60" height="60" class="mb-3">
                    <h1 class="h3 mb-3 fw-normal">Login</h1>
                    <p class="text-muted">Track. Compete. Level up.</p>
                </div>

                <form id="login-form">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingInput" name="email" placeholder="name@example.com" required>
                        <label for="floatingInput">Email address</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required>
                        <label for="floatingPassword">Password</label>
                    </div>

                    <div class="form-check text-start my-3">
                        <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault" checked>
                        <label class="form-check-label" for="flexCheckDefault">
                            Remember me
                        </label>
                    </div>
                    <button class="btn btn-primary w-100 py-2" type="submit">Start the Challenge</button>
                </form>

            </div>
        </div>
    </main>

    <!-- Floating shapes animation container -->
    <div class="background-shapes"></div>

    <!-- External JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
