<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules & Settings - SCT</title>
    <link rel="icon" href="assets/img/logo-sct.svg" type="image/svg+xml">

    <!-- External Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="bg-light">

    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="vh-100 p-3 bg-dark text-white" style="width: 280px;">
            <a class="navbar-brand d-flex align-items-center mb-4" href="index.html">
                <img src="assets/img/logo-sct.svg" alt="SCT Logo" width="40" height="40" class="me-2">
                <span>SCT</span>
            </a>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="log.html"><i class="bi bi-pencil-square me-2"></i>Log Progress</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="leaderboard.html"><i class="bi bi-trophy me-2"></i>Leaderboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="history.html"><i class="bi bi-clock-history me-2"></i>History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white active" href="settings.html"><i class="bi bi-gear me-2"></i>Rules & Settings</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="notifications.html"><i class="bi bi-bell me-2"></i>Notifications</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="flex-grow-1">
            <!-- Top Bar -->
            <header class="p-3 mb-4 border-bottom bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h5 mb-0">Hey, <span id="user-greeting">User</span> 👋</h1>
                        <small id="week-dates">Week of ...</small>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="badge bg-primary me-3" id="user-avatar-initial">U</span>
                    </div>
                </div>
            </header>

            <main class="p-4">
                <form id="settings-form" data-api-action="update-settings" data-api-endpoint="/api/settings">
                    <!-- Point Rules -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">Point Rules</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="hour-point" class="form-label">Points per Study Hour</label>
                                    <input type="number" class="form-control" id="hour-point" name="hourPoint" step="0.1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="course-point" class="form-label">Points per Course Completion</label>
                                    <input type="number" class="form-control" id="course-point" name="coursePoint">
                                </div>
                            </div>
                            <h6 class="mt-3">Bonuses</h6>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="bonus-toggle-1" checked disabled>
                                <label class="form-check-label" for="bonus-toggle-1">First 10h/week +20% bonus (Not editable)</label>
                            </div>
                             <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="bonus-toggle-2" checked disabled>
                                <label class="form-check-label" for="bonus-toggle-2">Streak bonus +2/week after 3 consecutive weeks (Not editable)</label>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Settings -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">Profile</h5>
                        </div>
                        <div class="card-body">
                             <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="theme" class="form-label">Theme</label>
                                    <select class="form-select" id="theme" name="theme">
                                        <option value="light">Light</option>
                                        <option value="dark">Dark</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="weekly-goal" class="form-label">Weekly Goal (Hours)</label>
                                    <input type="number" class="form-control" id="weekly-goal" name="weeklyGoal" step="1" min="1">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </main>
        </div>
    </div>

    <!-- Footer is omitted in the dashboard view for a cleaner interface -->

    <!-- External JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/store.js"></script>
    <script src="assets/js/points.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
