<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Progress - SCT</title>
    <link rel="icon" href="assets/img/logo-sct.svg" type="image/svg+xml">

    <!-- External Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="bg-light">

    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="vh-100 p-3 bg-dark text-white" style="width: 280px;">
            <a class="navbar-brand d-flex align-items-center mb-4" href="index.html">
                <img src="assets/img/logo-sct.svg" alt="SCT Logo" width="40" height="40" class="me-2">
                <span>SCT</span>
            </a>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white active" href="log.html"><i class="bi bi-pencil-square me-2"></i>Log Progress</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="leaderboard.html"><i class="bi bi-trophy me-2"></i>Leaderboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="history.html"><i class="bi bi-clock-history me-2"></i>History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="settings.html"><i class="bi bi-gear me-2"></i>Rules & Settings</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="notifications.html"><i class="bi bi-bell me-2"></i>Notifications</a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="flex-grow-1">
            <!-- Top Bar -->
            <header class="p-3 mb-4 border-bottom bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="h5 mb-0">Hey, <span id="user-greeting">User</span> 👋</h1>
                        <small id="week-dates">Week of ...</small>
                    </div>
                    <div class="d-flex align-items-center">
                        <span class="badge bg-primary me-3" id="user-avatar-initial">U</span>
                    </div>
                </div>
            </header>

            <main class="p-4">
                <header class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 mb-0">Log Progress</h1>
                </header>
                <div class="row g-4">
                    <!-- Study Hours Form -->
                    <div class="col-lg-6">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Log Study Hours</h5>
                                <form id="log-study-form" data-api-action="create-log" data-api-endpoint="/api/logs/study">
                                    <div class="mb-3">
                                        <label for="subject" class="form-label">Academic Module</label>
                                        <select class="form-select" id="subject" name="subject" required>
                                            <!-- Options will be populated by JS -->
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="hours" class="form-label">Hours</label>
                                        <input type="number" class="form-control" id="hours" name="hours" step="0.5" min="0.5" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="date" class="form-label">Date</label>
                                        <input type="date" class="form-control" id="date" name="date" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="notes" class="form-label">Notes</label>
                                        <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Log Hours</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Course Completion Form -->
                    <div class="col-lg-6">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Log Course Completion</h5>
                                <form id="log-course-form" data-api-action="create-log" data-api-endpoint="/api/logs/courses">
                                    <div class="mb-3">
                                        <label for="course-title" class="form-label">Course Title</label>
                                        <input type="text" class="form-control" id="course-title" name="course-title" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="provider" class="form-label">Provider (e.g., Coursera)</label>
                                        <input type="text" class="form-control" id="provider" name="provider">
                                    </div>
                                     <div class="mb-3">
                                        <label for="difficulty" class="form-label">Difficulty</label>
                                        <select class="form-select" id="difficulty" name="difficulty">
                                            <option>Easy</option>
                                            <option>Medium</option>
                                            <option>Hard</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="completed-on" class="form-label">Completed On</label>
                                        <input type="date" class="form-control" id="completed-on" name="completed-on" required>
                                    </div>
                                    <button type="submit" class="btn btn-success">Log Completion (+5 Points)</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Logs Table -->
                <div class="card shadow-sm mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Recent Logs (Last 10)</h5>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Details</th>
                                        <th>User</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-logs-body">
                                    <!-- Rows will be rendered by ui.js -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Footer is omitted in the dashboard view for a cleaner interface -->

    <!-- External JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <!-- Custom JS -->
    <script src="assets/js/store.js"></script>
    <script src="assets/js/points.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
